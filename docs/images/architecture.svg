<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DSH Coding Agent architecture</title>
  <desc id="desc">The CLI selects a Coding or ReproFix preset on the DSH runtime. ReproFix validates trusted commands, gates one writer, validates the final patch, and persists a receipt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7b8798"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="58" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Runtime ownership and request flow</text>
  <text x="60" y="90" fill="#5f6b7a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Composition stays separate from the DSH runtime; ReproFix adds one auditable transaction.</text>

  <rect x="60" y="130" width="220" height="110" rx="8" fill="#f7f9fc" stroke="#aeb8c6" stroke-width="2"/>
  <text x="170" y="170" text-anchor="middle" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">User entry</text>
  <text x="170" y="201" text-anchor="middle" fill="#4f5d70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">dshagent run</text>
  <text x="170" y="224" text-anchor="middle" fill="#4f5d70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">dshagent repair</text>

  <line x1="280" y1="185" x2="355" y2="185" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="370" y="118" width="290" height="134" rx="8" fill="#eef5ff" stroke="#1769e0" stroke-width="2"/>
  <text x="515" y="157" text-anchor="middle" fill="#123f7d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">CLI trust boundary</text>
  <text x="515" y="188" text-anchor="middle" fill="#3c5f8c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">validate + confirm repair.json</text>
  <text x="515" y="212" text-anchor="middle" fill="#3c5f8c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">canonical root + fingerprint</text>
  <text x="515" y="236" text-anchor="middle" fill="#3c5f8c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">owner-only launch context</text>

  <line x1="660" y1="185" x2="735" y2="185" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="750" y="118" width="390" height="134" rx="8" fill="#f1f8f4" stroke="#20a36a" stroke-width="2"/>
  <text x="945" y="157" text-anchor="middle" fill="#14633f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">DeepSeek Harness runtime</text>
  <text x="945" y="188" text-anchor="middle" fill="#356c54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Agent Loop | model adapters | tools | sandbox</text>
  <text x="945" y="212" text-anchor="middle" fill="#356c54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Session log | persistence | workflow engine</text>
  <text x="945" y="236" text-anchor="middle" fill="#356c54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Owned by DSH, not reimplemented here</text>

  <line x1="945" y1="252" x2="945" y2="306" stroke="#7b8798" stroke-width="3"/>
  <line x1="515" y1="252" x2="515" y2="306" stroke="#7b8798" stroke-width="3"/>
  <line x1="515" y1="306" x2="945" y2="306" stroke="#7b8798" stroke-width="3"/>
  <line x1="650" y1="306" x2="650" y2="342" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="306" x2="860" y2="342" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="430" y="356" width="350" height="116" rx="8" fill="#fff8e8" stroke="#d59224" stroke-width="2"/>
  <text x="605" y="395" text-anchor="middle" fill="#825313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Coding Preset</text>
  <text x="605" y="426" text-anchor="middle" fill="#795f37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">files | shell | search | skills | todo</text>
  <text x="605" y="451" text-anchor="middle" fill="#795f37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">DSH capability composition only</text>

  <rect x="820" y="356" width="320" height="116" rx="8" fill="#fff1f0" stroke="#d64545" stroke-width="2"/>
  <text x="980" y="395" text-anchor="middle" fill="#963131" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">ReproFix Preset</text>
  <text x="980" y="426" text-anchor="middle" fill="#7b3a3a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">RED gate | one writer | no shell</text>
  <text x="980" y="451" text-anchor="middle" fill="#7b3a3a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Self-implemented repair contract</text>

  <line x1="980" y1="472" x2="980" y2="520" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="540" width="1080" height="112" rx="8" fill="#f7f9fc" stroke="#c5ccd7" stroke-width="2"/>
  <circle cx="150" cy="596" r="32" fill="#fff1f0" stroke="#d64545" stroke-width="3"/>
  <circle cx="380" cy="596" r="32" fill="#eef5ff" stroke="#1769e0" stroke-width="3"/>
  <circle cx="610" cy="596" r="32" fill="#fff8e8" stroke="#d59224" stroke-width="3"/>
  <circle cx="840" cy="596" r="32" fill="#eaf8f1" stroke="#20a36a" stroke-width="3"/>
  <circle cx="1060" cy="596" r="32" fill="#f1efff" stroke="#7357c7" stroke-width="3"/>
  <text x="150" y="601" text-anchor="middle" fill="#a52f2f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">RED</text>
  <text x="380" y="601" text-anchor="middle" fill="#1454ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">EDIT</text>
  <text x="610" y="601" text-anchor="middle" fill="#825313" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PATCH</text>
  <text x="840" y="601" text-anchor="middle" fill="#14764c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">GREEN</text>
  <text x="1060" y="601" text-anchor="middle" fill="#59429d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">RECEIPT</text>
  <line x1="182" y1="596" x2="342" y2="596" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="412" y1="596" x2="572" y2="596" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="642" y1="596" x2="802" y2="596" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="872" y1="596" x2="1022" y2="596" stroke="#7b8798" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
