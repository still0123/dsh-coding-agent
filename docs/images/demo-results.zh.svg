<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">已验证的 ReproFix 演示结果</title>
  <desc id="desc">三个 fixture 演示分别以 not_reproduced、fixed、validation_failed 终止,并各自写入回执。仓库通过单元、集成、Preset 冒烟及 Linux、macOS、Windows 检查。</desc>
  <rect width="1200" height="560" fill="#101827"/>
  <rect x="38" y="34" width="1124" height="492" rx="8" fill="#151f30" stroke="#35445a" stroke-width="2"/>
  <circle cx="72" cy="67" r="7" fill="#e25b55"/>
  <circle cx="96" cy="67" r="7" fill="#e0a52e"/>
  <circle cx="120" cy="67" r="7" fill="#42b883"/>
  <text x="600" y="74" text-anchor="middle" fill="#9fb0c7" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">已验证的 fixture 演示</text>

  <text x="76" y="134" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="18">$ pnpm demo:not-reproduced</text>
  <rect x="760" y="105" width="330" height="48" rx="7" fill="#2b2530" stroke="#d59224"/>
  <text x="925" y="136" text-anchor="middle" fill="#f2bd56" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700">not_reproduced</text>
  <text x="76" y="166" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">失败特征不匹配 → writer 从未启动</text>
  <text x="76" y="188" fill="#6f8199" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13">✓ reprofix/receipt 已写入</text>

  <line x1="76" y1="207" x2="1124" y2="207" stroke="#2e3b4f"/>
  <text x="76" y="258" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="18">$ pnpm demo:fixed</text>
  <rect x="760" y="229" width="330" height="48" rx="7" fill="#193329" stroke="#20a36a"/>
  <text x="925" y="260" text-anchor="middle" fill="#64d39b" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700">fixed</text>
  <text x="76" y="290" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">单文件 +1 / -1 → 修复后复现 PASS</text>
  <text x="76" y="312" fill="#6f8199" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13">✓ reprofix/receipt 已写入</text>

  <line x1="76" y1="331" x2="1124" y2="331" stroke="#2e3b4f"/>
  <text x="76" y="382" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="18">$ pnpm demo:validation-failed</text>
  <rect x="760" y="353" width="330" height="48" rx="7" fill="#382326" stroke="#d64545"/>
  <text x="925" y="384" text-anchor="middle" fill="#f07d78" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700">validation_failed</text>
  <text x="76" y="414" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">补丁通过复现,验收命令按设计退出 7</text>
  <text x="76" y="436" fill="#6f8199" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13">✓ reprofix/receipt 已写入</text>

  <rect x="76" y="458" width="1048" height="42" rx="7" fill="#0f1724" stroke="#35445a"/>
  <text x="108" y="485" fill="#64d39b" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700">89 单元</text>
  <text x="220" y="485" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">|</text>
  <text x="260" y="485" fill="#64d39b" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700">24 集成</text>
  <text x="372" y="485" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">|</text>
  <text x="412" y="485" fill="#64d39b" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700">2 Preset 冒烟</text>
  <text x="566" y="485" fill="#8da2bd" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15">|</text>
  <text x="606" y="485" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">Linux</text>
  <text x="702" y="485" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">macOS</text>
  <text x="806" y="485" fill="#c3cfdd" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif" font-size="15">Windows</text>
</svg>
